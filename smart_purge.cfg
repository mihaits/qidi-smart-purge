# Smart purge for the QIDI Plus5 + QIDI Box.
# Installed as ~/printer_data/config/klipper-macros-qd/smart_purge.cfg; that
# folder is included with *.cfg, so printer.cfg is untouched. install.sh puts
# it there; "install.sh uninstall" deletes it and restarts Klipper.
#
# Slicer start G-code:
#   SMART_PURGE_CHECK EXTRUDER=<n>      (BEFORE BOX_PRINT_START)
#   BOX_PRINT_START ...
#   SMART_FLUSH HOTEND=<temp>           (replaces EXTRUSION_AND_FLUSH)
#   SMART_PRIME LEN=200 SHORT=25        (replaces G1 E200 F300)
#
# The purge is skipped only when the slot for that tool is already in the
# nozzle AND its filament type/color/vendor match what was in the nozzle at
# the last print. Swapping a spool in that slot to a different filament or
# color changes the signature, so it gets a full purge.
# smart_purge_sig = an integer hash of "slot|filament|color|vendor" (the saved
# variables QIDI keeps per slot; since firmware 01.01.02.01 filament is an ID
# string like 'QFG04' and color a list like ['FAFAFA']). It stays an integer:
# QIDI's SAVE_VARIABLE shuts Klipper down on a value it can't parse.

[gcode_macro SMART_PURGE_CHECK]
description: Before BOX_PRINT_START: decide whether the start purge is needed
variable_skip: 0
gcode:
  {% set sv = printer.save_variables.variables %}
  {% set T = params.EXTRUDER|default(0)|int %}
  {% set want = sv['value_t%d' % T]|default('slot%d' % T) %}
  {% set n = want[4:]|int %}
  {% set raw = "%d|%s|%s|%s" % (n, sv['filament_slot%d' % n]|default(''), sv['color_slot%d' % n]|default(''), sv['vendor_slot%d' % n]|default('')) %}
  {% set ns = namespace(h=7) %}
  {% for c in raw|upper %}{% set ns.h = (ns.h * 41 + "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ|[]',".find(c) + 1) % 2147483647 %}{% endfor %}
  {% set sig = ns.h %}
  {% set last = sv.smart_purge_sig|default(-1)|int %}
  {% set in_nozzle = sv.slot_sync|default('') == want and sv[want]|default(0)|int == 2 %}
  {% set same = sv.enable_box|default(0)|int == 1 and in_nozzle and (last == sig or last == -1) %}
  SET_GCODE_VARIABLE MACRO=SMART_PURGE_CHECK VARIABLE=skip VALUE={1 if same else 0}
  {% if same %}
    M118 Smart purge: {want} already loaded (same filament), skipping purge
  {% elif sv.enable_box|default(0)|int != 1 %}
    M118 Smart purge: box disabled, full purge
  {% elif not in_nozzle %}
    M118 Smart purge: {want} not loaded (nozzle has {sv.slot_sync|default('?')}), full purge
  {% else %}
    M118 Smart purge: spool in {want} changed since last print, full purge
  {% endif %}

[gcode_macro SMART_FLUSH]
description: EXTRUSION_AND_FLUSH only when SMART_PURGE_CHECK says it is needed
gcode:
  {% if printer["gcode_macro SMART_PURGE_CHECK"].skip|int == 0 %}
    EXTRUSION_AND_FLUSH HOTEND={params.HOTEND|int}
  {% elif printer['filament_switch_sensor filament_switch_sensor'].filament_detected == False %}
    # same runout handling as EXTRUSION_AND_FLUSH
    M118 Filament run out
    PAUSE
    SET_PRINT_SUB_STATUS SUB_STATUS=box_filament_exhausted
  {% endif %}

[gcode_macro SMART_PRIME]
description: Long purge after a filament change, short prime otherwise; records what is loaded
gcode:
  {% set full = params.LEN|default(200)|float %}
  {% set short = params.SHORT|default(25)|float %}
  M83
  G1 E{short if printer["gcode_macro SMART_PURGE_CHECK"].skip|int == 1 else full} F300
  _SMART_PURGE_SAVE

[gcode_macro _SMART_PURGE_SAVE]
gcode:
  {% set sv = printer.save_variables.variables %}
  {% set n = (sv.slot_sync|default('slot0'))[4:]|int %}
  {% set raw = "%d|%s|%s|%s" % (n, sv['filament_slot%d' % n]|default(''), sv['color_slot%d' % n]|default(''), sv['vendor_slot%d' % n]|default('')) %}
  {% set ns = namespace(h=7) %}
  {% for c in raw|upper %}{% set ns.h = (ns.h * 41 + "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ|[]',".find(c) + 1) % 2147483647 %}{% endfor %}
  {% set sig = ns.h %}
  SAVE_VARIABLE VARIABLE=smart_purge_sig VALUE={sig}
